services:
  postgres:
    image: postgres:16
    container_name: quote-postgres
    environment:
      POSTGRES_DB: quote_db
      POSTGRES_USER: quote_user
      POSTGRES_PASSWORD: quote_pass
    ports:
      - "5432:5432"
    volumes:
      - quote_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: quote-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - quote_rabbitmq_data:/var/lib/rabbitmq

volumes:
  quote_postgres_data:
  quote_rabbitmq_data:

